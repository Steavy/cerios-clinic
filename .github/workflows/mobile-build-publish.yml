name: Build & Publish Mobile APK (Demo)
# self-heal: true

on:
  push:
    branches: [main]
    paths:
      - "apps/patient-mobile/**"
      - "infra/docker/Dockerfile.mobile"
      - ".nvmrc"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  
env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK (Demo Profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history so git describe finds the latest v* tag

      - name: Calculate demo version
        id: demo_version
        run: |
          # Same logic as docker-publish.yml (build-demo-portals)
          # Only semver tags (v*) count; demo-*/emulator-* release tags are ignored
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          BASE_VERSION=${LATEST_TAG#v}
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD)
          DEMO_VERSION="${BASE_VERSION}-demo.${COMMIT_COUNT}"
          echo "VERSION=${DEMO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Generate mobile .env (demo profile)
        run: node apps/patient-mobile/setup-env.mjs demo
        env:
          APP_VERSION: ${{ steps.demo_version.outputs.VERSION }}

      - name: Install local node_modules for React Native Gradle plugin
        run: npm --prefix apps/patient-mobile install

      - name: Build release APK
        working-directory: apps/patient-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK output
        run: |
          ls -lh apps/patient-mobile/android/app/build/outputs/apk/release/
          test -f apps/patient-mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: patient-mobile-apk-demo
          path: apps/patient-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release (demo)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: demo-${{ github.sha }}
          name: Cerios Patient Mobile Demo (CI ${{ github.sha }})
          body: |
            ## Cerios Patient Mobile Demo (CI Build)

            ### Download
            Download the APK below and install it on your Android device.

            This build uses the **demo profile** (API: `http://demo-sparta.mooo.com:3001/api`).
            For production use.

            ### Build Info
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Build: #${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}

            ### Setup
            See [MOBILE.md](https://github.com/${{ github.repository }}/blob/main/MOBILE.md) for instructions.
          files: apps/patient-mobile/android/app/build/outputs/apk/release/app-release.apk

  publish-image:
    name: Publish patient-mobile image
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: patient-mobile-apk-demo
          path: apk

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/patient-mobile
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.mobile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=patient-mobile
          cache-to: type=gha,mode=max,scope=patient-mobile
