name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: results

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: results
          if-no-files-found: warn

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            --env HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            semgrep/semgrep:latest \
            semgrep scan --config auto --sarif --output /src/semgrep.sarif /src

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Scans the current working tree (no git-history scan) so already-removed
      # historical leaks are not re-flagged on every PR. Demo credentials in
      # docker-compose/.env files are intentional; review findings and flip
      # continue-on-error to false once the baseline is clean.
      - name: Run Gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            gitleaks/gitleaks:latest \
            detect --source /repo --no-git --no-banner --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  publish:
    name: Publish SAST report to report/sast
    needs: [codeql, semgrep, secrets]
    # Publish findings even when a scanner job fails so the report stays current.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download CodeQL SARIF
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: codeql-sarif
          path: sarif/codeql

      - name: Download Semgrep SARIF
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: semgrep-sarif
          path: sarif/semgrep

      - name: Download Gitleaks SARIF
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: gitleaks-sarif
          path: sarif/gitleaks

      - name: Render SAST report
        id: render
        run: |
          if [ -z "$(find sarif -name '*.sarif' 2>/dev/null)" ]; then
            echo "No SARIF files found; skipping publish."
            echo "has_sarif=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/sarif-to-html.py sarif sast-site
          echo "has_sarif=true" >> "$GITHUB_OUTPUT"

      - name: Publish to report/sast branch
        if: steps.render.outputs.has_sarif == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: report/sast
          publish_dir: sast-site
          force_orphan: true
          commit_message: "SAST report ${{ github.sha }}"

      - name: Trigger GitHub Pages deploy
        if: steps.render.outputs.has_sarif == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Steavy/cerios-clinic/dispatches \
              -d '{"event_type": "allure-report"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "repository_dispatch sent"
              exit 0
            fi
            echo "dispatch attempt $i returned $HTTP_CODE"
            sleep 10
          done
          exit 1
