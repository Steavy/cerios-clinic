name: Deploy Reports to Pages

on:
  repository_dispatch:
    types: [allure-report]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Allure report branch
        uses: actions/checkout@v7
        with:
          ref: report/allure
          path: allure

      - name: Checkout Stryker report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/stryker
          path: stryker

      - name: Checkout Mobile Allure report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/allure-mobile
          path: mobile-allure

      - name: Checkout ZAP DAST report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/zap
          path: zap

      - name: Assemble combined site (Allure at /, Stryker at /strykerreport/, Mobile at /mobile/, DAST at /dast/)
        run: |
          mkdir -p combined
          cp -a allure/. combined/
          if [ -d stryker ] && [ -n "$(ls -A stryker)" ]; then
            mkdir -p combined/strykerreport
            cp -a stryker/. combined/strykerreport/
            echo "strykerreport added"
          else
            echo "no strykerreport yet (report/stryker not populated)"
          fi
          if [ -d mobile-allure ] && [ -n "$(ls -A mobile-allure)" ]; then
            mkdir -p combined/mobile
            cp -a mobile-allure/. combined/mobile/
            echo "mobile report added"
          else
            echo "no mobile report yet (report/allure-mobile not populated)"
          fi
          if [ -d zap ] && [ -n "$(ls -A zap)" ]; then
            mkdir -p combined/dast
            cp -a zap/. combined/dast/
            echo "dast report added"
          else
            echo "no dast report yet (report/zap not populated)"
          fi
          ls -la combined/ | head

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
