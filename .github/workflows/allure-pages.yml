name: Deploy Reports to Pages
# self-heal: true

on:
  repository_dispatch:
    types: [allure-report]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Allure report branch
        uses: actions/checkout@v7
        with:
          ref: report/allure
          path: allure

      - name: Checkout Stryker report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/stryker
          path: stryker

      - name: Checkout Mobile Allure report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/allure-mobile
          path: mobile-allure

      - name: Checkout ZAP DAST report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/zap
          path: zap

      - name: Checkout SAST report branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: report/sast
          path: sast

      - name: Assemble combined site (Allure at /, Stryker at /strykerreport/, Mobile at /mobile/, DAST at /dast/, SAST at /sast/)
        run: |
          mkdir -p combined
          cp -a allure/. combined/
          if [ -d stryker ] && [ -n "$(ls -A stryker)" ]; then
            mkdir -p combined/strykerreport
            cp -a stryker/. combined/strykerreport/
            echo "strykerreport added"
          else
            echo "no strykerreport yet (report/stryker not populated)"
          fi
          if [ -d mobile-allure ] && [ -n "$(ls -A mobile-allure)" ]; then
            mkdir -p combined/mobile
            cp -a mobile-allure/. combined/mobile/
            echo "mobile report added"
          else
            echo "no mobile report yet (report/allure-mobile not populated)"
          fi
          if [ -d zap ] && [ -n "$(ls -A zap)" ]; then
            mkdir -p combined/dast
            cp -a zap/. combined/dast/
            echo "dast report added"
          else
            echo "no dast report yet (report/zap not populated)"
          fi
          if [ -d sast ] && [ -n "$(ls -A sast)" ]; then
            mkdir -p combined/sast
            cp -a sast/. combined/sast/
            echo "sast report added"
          else
            echo "no sast report yet (report/sast not populated)"
          fi
          ls -la combined/ | head

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: combined

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              --jq '.total_count // 0')
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt ${attempt}/10)"
            sleep 3
          done
          echo "Pages artifact did not become visible" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
