name: Notify Opencode on Failure

on:
  workflow_run:
    workflows: ["Build & Publish Docker Images"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: notify-opencode
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push failure to Opencode session on the demo server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            bash /root/opencode-fix/opencode-fix-workflow.sh \
              "$(printf '%s' '${{ github.event.workflow_run.repository.full_name }}' | base64 -w0)" \
              "$(printf '%s' '${{ github.event.workflow_run.id }}' | base64 -w0)" \
              "$(printf '%s' '${{ github.event.workflow_run.name }}' | base64 -w0)" \
              "$(printf '%s' '${{ github.event.workflow_run.html_url }}' | base64 -w0)" \
              "$(printf '%s' '${{ github.event.workflow_run.head_sha }}' | base64 -w0)" \
              "$(printf '%s' '${{ github.event.workflow_run.head_branch }}' | base64 -w0)"
