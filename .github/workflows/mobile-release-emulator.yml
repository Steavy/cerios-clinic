name: Build Mobile APK (Emulator Profile)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0-test)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Emulator Profile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Generate mobile .env (emulator profile)
        run: node apps/patient-mobile/setup-env.mjs emulator
        env:
          APP_VERSION: ${{ inputs.version }}

      - name: Install local node_modules for React Native Gradle plugin
        run: npm --prefix apps/patient-mobile install

      - name: Build release APK
        working-directory: apps/patient-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cerios-patient-mobile-emulator
          path: apps/patient-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Rename APK
        run: cp apps/patient-mobile/android/app/build/outputs/apk/release/app-release.apk cerios-patient-mobile-emulator-${{ inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}-emulator
          name: Cerios Patient Mobile Emulator ${{ inputs.version }}
          body: |
            ## Cerios Patient Mobile Emulator ${{ inputs.version }}

            ### Download
            Download the APK below and install it on your Android device.

            This build uses the **emulator profile** (API: `http://10.0.2.2:3001/api`).
            Works on Android emulators. For physical devices on the same LAN, use the LAN profile instead.

            ### Setup
            See [MOBILE.md](https://github.com/${{ github.repository }}/blob/main/MOBILE.md) for instructions.
          files: cerios-patient-mobile-emulator-${{ inputs.version }}.apk