name: Build & Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # API services
          - image: api-patient
            dockerfile: infra/docker/Dockerfile.api
            build-args: APP_NAME=api-patient
          - image: api-doctor
            dockerfile: infra/docker/Dockerfile.api
            build-args: APP_NAME=api-doctor
          - image: api-assistant
            dockerfile: infra/docker/Dockerfile.api
            build-args: APP_NAME=api-assistant
          - image: api-admin
            dockerfile: infra/docker/Dockerfile.api
            build-args: APP_NAME=api-admin

          # Frontend portals
          - image: patient-portal
            dockerfile: infra/docker/Dockerfile.frontend
            build-args: APP_NAME=patient-portal
          - image: doctor-portal
            dockerfile: infra/docker/Dockerfile.frontend
            build-args: APP_NAME=doctor-portal
          - image: assistant-portal
            dockerfile: infra/docker/Dockerfile.frontend
            build-args: APP_NAME=assistant-portal
          - image: admin-portal
            dockerfile: infra/docker/Dockerfile.frontend
            build-args: APP_NAME=admin-portal

          # Database init
          - image: db-init
            dockerfile: infra/docker/Dockerfile.db-init
            build-args: ""

          # Infrastructure (baked-in config for clone-free usage)
          - image: keycloak
            dockerfile: infra/docker/Dockerfile.keycloak
            build-args: ""
          - image: postgres
            dockerfile: infra/docker/Dockerfile.postgres
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

  build-demo-portals:
    name: Build demo ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: [patient-portal, doctor-portal, assistant-portal, admin-portal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.image }}
          tags: |
            type=raw,value=demo,enable={{is_default_branch}}
            type=sha,prefix=demo-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          build-args: |
            APP_NAME=${{ matrix.image }}
            VITE_KEYCLOAK_URL=http://demo-sparta.mooo.com:8180
            VITE_KEYCLOAK_REALM=clinic
            VITE_PATIENT_KEYCLOAK_CLIENT_ID=patient-portal-client
            VITE_DOCTOR_KEYCLOAK_CLIENT_ID=doctor-portal-client
            VITE_ASSISTANT_KEYCLOAK_CLIENT_ID=assistant-portal-client
            VITE_ADMIN_KEYCLOAK_CLIENT_ID=admin-portal-client
            VITE_PATIENT_API_BASE_URL=http://demo-sparta.mooo.com:3001/api
            VITE_DOCTOR_API_BASE_URL=http://demo-sparta.mooo.com:3002/api
            VITE_ASSISTANT_API_BASE_URL=http://demo-sparta.mooo.com:3003/api
            VITE_ADMIN_API_BASE_URL=http://demo-sparta.mooo.com:3004/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-demo
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-demo

  dispatch-smoke:
    name: Dispatch smoke test in playwright-sparta
    runs-on: ubuntu-latest
    needs: [build-and-push, build-demo-portals]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch smoke test with built image SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Steavy',
              repo: 'playwright-sparta',
              workflow_id: 'smoke-test-ci.yml',
              ref: 'main',
              inputs: { 'image-tag': context.sha },
            })

  notify-opencode-on-failure:
    name: Notify opencode on build failure
    runs-on: ubuntu-latest
    needs: [build-and-push, build-demo-portals]
    if: failure() && !cancelled()
    steps:
      - name: Dispatch failure bridge in playwright-sparta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Steavy',
              repo: 'playwright-sparta',
              workflow_id: 'handle-opencode-failure.yml',
              ref: 'main',
              inputs: {
                repo: `${context.repo.owner}/${context.repo.repo}`,
                'run-id': String(context.runId),
                'workflow-name': context.workflow,
                'run-url': `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'head-sha': context.sha,
                'head-branch': context.ref.replace('refs/heads/', ''),
              },
            })
