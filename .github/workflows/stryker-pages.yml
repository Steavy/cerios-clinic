name: Stryker Mutation Report

on:
  workflow_dispatch:
  repository_dispatch:
    types: [stryker-report]
  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: stryker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mutation:
    name: Run StrykerJS mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Run StrykerJS mutation tests
        run: pnpm test:stryker
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Verify HTML report
        run: |
          test -f reports/mutation/mutation.html
          ls -lh reports/mutation/

      - name: Upload Stryker HTML report
        uses: actions/upload-artifact@v6
        with:
          name: stryker-html-report
          path: reports/mutation/mutation.html
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish report to report/stryker
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Stryker HTML report
        uses: actions/download-artifact@v7
        with:
          name: stryker-html-report
          path: stryker-report

      - name: Prepare publish dir (index.html at root)
        run: |
          mkdir -p stryker-site
          cp stryker-report/mutation.html stryker-site/index.html
          ls -lh stryker-site/

      - name: Publish to report/stryker branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: report/stryker
          publish_dir: stryker-site
          force_orphan: true
          commit_message: "Stryker mutation report ${{ github.sha }}"

      - name: Trigger GitHub Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Steavy/cerios-clinic/dispatches \
              -d '{"event_type": "allure-report"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "repository_dispatch sent"
              exit 0
            fi
            echo "dispatch attempt $i returned $HTTP_CODE"
            sleep 10
          done
          exit 1
