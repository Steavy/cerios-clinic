name: Renovate

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.21
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
