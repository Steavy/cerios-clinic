name: Renovate

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.0
        with:
          configurationFile: renovate-global.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: "info"
          RENOVATE_REPOSITORIES: '["Steavy/cerios-clinic"]'
