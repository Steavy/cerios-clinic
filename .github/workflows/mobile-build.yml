name: Mobile CI Checks

on:
  push:
    branches: [main]
    paths:
      - "apps/patient-mobile/**"
      - "infra/docker/Dockerfile.mobile"
      - ".nvmrc"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Run lint
        run: pnpm --filter @clinic/patient-mobile lint

      - name: Run typecheck
        run: pnpm --filter @clinic/patient-mobile typecheck

  notify-opencode-on-failure:
    name: Notify opencode on mobile build failure
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: failure() && !cancelled()

    steps:
      - name: Dispatch failure bridge to playwright-sparta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: "Steavy",
              repo: "playwright-sparta",
              workflow_id: "handle-opencode-failure.yml",
              ref: "main",
              inputs: {
                repo: `${context.repo.owner}/${context.repo.repo}`,
                "run-id": String(context.runId),
                "workflow-name": context.workflow,
                "run-url": `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "head-sha": context.sha,
                "head-branch": context.ref.replace("refs/heads/", ""),
              },
            });