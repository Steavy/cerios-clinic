# Demo deployment for demo-sparta.mooo.com
# Started from published ghcr.io/steavy/cerios-clinic images by
# infra/deploy-demo.sh (triggered by the deploy-demo workflow in
# playwright-sparta after the smoke tests pass). The portal images use the
# `demo` tag (built with demo-sparta.mooo.com URLs baked in); the rest use
# `latest`. Ports match the live demo stack: portals 5173-5176, APIs
# 3001/3002-3004, keycloak 8180, postgres 5432, mailpit 1025/8025.

services:
  postgres:
    image: ghcr.io/steavy/cerios-clinic/postgres:latest
    container_name: clinic-postgres
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_secret
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ghcr.io/steavy/cerios-clinic/keycloak:latest
    container_name: clinic-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/clinic_db
      KC_DB_USERNAME: clinic
      KC_DB_PASSWORD: clinic_secret
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q 'status' && echo healthy || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  mailpit:
    image: axllent/mailpit:latest
    container_name: clinic-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  db-init:
    container_name: clinic-db-init
    image: ghcr.io/steavy/cerios-clinic/db-init:latest
    environment:
      DATABASE_URL: "postgresql://clinic:clinic_secret@postgres:5432/clinic_db"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: clinic
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secret
      SEED_STAFF_PASSWORD: "Clinic1234!"
      SEED_PATIENT_PASSWORD: "Patient1234!"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: "no"

  api-patient:
    container_name: clinic-api-patient
    image: ghcr.io/steavy/cerios-clinic/api-patient:latest
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: production
      ENABLE_SWAGGER: "true"
      DATABASE_URL: "postgresql://clinic:clinic_secret@postgres:5432/clinic_db"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "http://demo-sparta.mooo.com:8180"
      KEYCLOAK_REALM: clinic
      KEYCLOAK_PATIENT_CLIENT_ID: patient-portal-client
      KEYCLOAK_ADMIN_CLIENT_ID: api-service-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: api_service_secret_change_in_prod
      API_PATIENT_CORS_ORIGINS: "http://localhost:5173,http://techlab5.mooo.com:5173,http://demo-sparta.mooo.com:5173"
      PATIENT_PORTAL_URL: "http://demo-sparta.mooo.com:5173"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-doctor:
    container_name: clinic-api-doctor
    image: ghcr.io/steavy/cerios-clinic/api-doctor:latest
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NODE_ENV: production
      ENABLE_SWAGGER: "true"
      DATABASE_URL: "postgresql://clinic:clinic_secret@postgres:5432/clinic_db"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "http://demo-sparta.mooo.com:8180"
      KEYCLOAK_REALM: clinic
      KEYCLOAK_DOCTOR_CLIENT_ID: doctor-portal-client
      KEYCLOAK_ADMIN_CLIENT_ID: api-service-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: api_service_secret_change_in_prod
      API_DOCTOR_CORS_ORIGINS: "http://localhost:5174,http://techlab5.mooo.com:5174,http://demo-sparta.mooo.com:5174"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-assistant:
    container_name: clinic-api-assistant
    image: ghcr.io/steavy/cerios-clinic/api-assistant:latest
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      NODE_ENV: production
      ENABLE_SWAGGER: "true"
      DATABASE_URL: "postgresql://clinic:clinic_secret@postgres:5432/clinic_db"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "http://demo-sparta.mooo.com:8180"
      KEYCLOAK_REALM: clinic
      KEYCLOAK_ASSISTANT_CLIENT_ID: assistant-portal-client
      KEYCLOAK_ADMIN_CLIENT_ID: api-service-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: api_service_secret_change_in_prod
      API_ASSISTANT_CORS_ORIGINS: "http://localhost:5175,http://techlab5.mooo.com:5175,http://demo-sparta.mooo.com:5175"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-admin:
    container_name: clinic-api-admin
    image: ghcr.io/steavy/cerios-clinic/api-admin:latest
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      NODE_ENV: production
      ENABLE_SWAGGER: "true"
      DATABASE_URL: "postgresql://clinic:clinic_secret@postgres:5432/clinic_db"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_PUBLIC_URL: "http://demo-sparta.mooo.com:8180"
      KEYCLOAK_REALM: clinic
      KEYCLOAK_ADMIN_PORTAL_CLIENT_ID: admin-portal-client
      KEYCLOAK_ADMIN_CLIENT_ID: api-service-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: api_service_secret_change_in_prod
      API_ADMIN_CORS_ORIGINS: "http://localhost:5176,http://techlab5.mooo.com:5176,http://demo-sparta.mooo.com:5176"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  patient-portal:
    container_name: clinic-patient-portal
    image: ghcr.io/steavy/cerios-clinic/patient-portal:demo
    ports:
      - "5173:80"
    depends_on:
      api-patient:
        condition: service_healthy

  doctor-portal:
    container_name: clinic-doctor-portal
    image: ghcr.io/steavy/cerios-clinic/doctor-portal:demo
    ports:
      - "5174:80"
    depends_on:
      api-doctor:
        condition: service_healthy

  assistant-portal:
    container_name: clinic-assistant-portal
    image: ghcr.io/steavy/cerios-clinic/assistant-portal:demo
    ports:
      - "5175:80"
    depends_on:
      api-assistant:
        condition: service_healthy

  admin-portal:
    container_name: clinic-admin-portal
    image: ghcr.io/steavy/cerios-clinic/admin-portal:demo
    ports:
      - "5176:80"
    depends_on:
      api-admin:
        condition: service_healthy

volumes:
  clinic_postgres_data:
