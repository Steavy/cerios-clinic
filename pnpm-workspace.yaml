packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: true
verifyDepsBeforeRun: false

# Single source of truth for versions shared across apps/packages.
# Mobile (patient-mobile) is intentionally excluded for deps that diverge
# due to React Native toolchain constraints (react, typescript, @types/react).
catalog:
  # --- Shared ---
  typescript: ^6.0.3
  "@types/node": ^25.9.5
  tsx: ^4.23.13

  # --- Frontend runtime ---
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router-dom: ^7.18.4
  keycloak-js: ^26.2.4
  axios: ^1.20.0
  lucide-react: ^1.47.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1

  # --- Frontend build / dev ---
  vite: ^8.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@tailwindcss/postcss": ^4.3.3
  autoprefixer: ^10.6.1
  postcss: ^8.5.28
  tailwindcss: ^4.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # --- Backend runtime ---
  "@nestjs/common": ^11.1.28
  "@nestjs/core": ^11.1.28
  "@nestjs/passport": ^11.0.5
  "@nestjs/platform-express": ^11.1.28
  "@nestjs/swagger": ^11.4.6
  "@nestjs/throttler": ^6.5.0
  class-validator: ^0.15.1
  class-transformer: ^0.5.1
  passport: ^0.7.0
  passport-jwt: ^4.0.1
  jwks-rsa: ^4.1.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

  # --- Backend types ---
  "@types/express": ^5.0.6
  "@types/passport-jwt": ^4.0.1

  # --- Prisma / DB ---
  "@prisma/adapter-pg": ^7.10.0
  "@prisma/client": ^7.10.0
  prisma: ^7.10.0
  pg: ^8.23.0
  "@types/pg": ^8.23.1

  # --- Misc ---
  dotenv: ^17.4.2

allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - jsdom@30.1.0
  - lucide-react@1.47.0
  - react-native-safe-area-context@5.10.0
