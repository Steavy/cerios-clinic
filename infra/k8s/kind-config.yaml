# kind cluster config for the demo host (91.99.134.58).
# Publishes the demo ports on the host via NodePort services (see infra/k8s).
# kind requires extraPortMappings.containerPort == service nodePort; the
# hostPort is the public port exposed on the host:
#   external port -> node port (service nodePort)
#   3001-3004 (APIs)      -> 30001-30004
#   5173-5176 (portals)   -> 30005-30008
#   8180   (keycloak)     -> 30009
#   8025   (mailpit)      -> 30010
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clawshop-cluster
networking:
  # Expose the API server on the host as before (0.0.0.0:6443). Without this
  # kind binds a random loopback port, breaking remote kubectl access.
  apiServerAddress: 0.0.0.0
  apiServerPort: 6443
kubeadmConfigPatches:
  # Add the public IP as a SAN so https://91.99.134.58:6443 verifies over TLS.
  - |
    apiVersion: kubeadm.k8s.io/v1beta3
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "91.99.134.58"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30001
        hostPort: 3001
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30002
        hostPort: 3002
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30003
        hostPort: 3003
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30004
        hostPort: 3004
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30005
        hostPort: 5173
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30006
        hostPort: 5174
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30007
        hostPort: 5175
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30008
        hostPort: 5176
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30009
        hostPort: 8180
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30010
        hostPort: 8025
        listenAddress: 0.0.0.0
        protocol: TCP
