# Mailpit for the demo stack (SMTP sink + web UI).
# Internal SMTP on mailpit:1025, external web UI on demo-sparta.mooo.com:8025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: clinic
  labels:
    app: mailpit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          imagePullPolicy: Always
          resources:
            limits:
              memory: 512Mi
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
---
# Internal ClusterIP service used as SMTP_HOST by the APIs.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: clinic
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
---
# External NodePort service for the web UI: demo-sparta.mooo.com:8025.
apiVersion: v1
kind: Service
metadata:
  name: mailpit-web
  namespace: clinic
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: 30010
