# The four portals (nginx static, demo tag with demo-sparta.mooo.com URLs
# baked in). External exposure via NodePort services matching the minikube
# --ports (host:5173-5176 -> node:30005-30008).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal
  namespace: clinic
  labels:
    app: patient-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: patient-portal
  template:
    metadata:
      labels:
        app: patient-portal
    spec:
      containers:
        - name: patient-portal
          image: ghcr.io/steavy/cerios-clinic/patient-portal:demo
          imagePullPolicy: Always
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: patient-portal
  namespace: clinic
spec:
  type: NodePort
  selector:
    app: patient-portal
  ports:
    - name: http
      port: 5173
      targetPort: 80
      nodePort: 30005
---
