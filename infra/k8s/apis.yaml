# The four API services. External exposure via NodePort services matching the
# minikube --ports (host:3001-3004 -> node:30001-30004). Probes hit the
# same /api/health endpoint the deploy script and workflow verify.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-patient
  namespace: clinic
  labels:
    app: api-patient
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-patient
  template:
    metadata:
      labels:
        app: api-patient
    spec:
      containers:
        - name: api-patient
          image: ghcr.io/steavy/cerios-clinic/api-patient:latest
          imagePullPolicy: Always
          resources:
            limits:
              memory: 512Mi
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: ENABLE_SWAGGER
              value: "true"
            - name: DATABASE_URL
              value: postgresql://clinic:clinic_secret@postgres:5432/clinic_db
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_PUBLIC_URL
              value: http://demo-sparta.mooo.com:8180
            - name: KEYCLOAK_REALM
              value: clinic
            - name: KEYCLOAK_PATIENT_CLIENT_ID
              value: patient-portal-client
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: api-service-client
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              value: api_service_secret_change_in_prod
            - name: API_PATIENT_CORS_ORIGINS
              value: http://localhost:5173,http://techlab5.mooo.com:5173,http://demo-sparta.mooo.com:5173
            - name: PATIENT_PORTAL_URL
              value: http://demo-sparta.mooo.com:5173
            - name: SMTP_HOST
              value: mailpit
            - name: SMTP_PORT
              value: "1025"
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api-patient
  namespace: clinic
spec:
  type: NodePort
  selector:
    app: api-patient
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
---
