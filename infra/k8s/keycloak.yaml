# Keycloak for the demo stack. Shares clinic_db (schema "keycloak"), so the
# realm persists in postgres and --import-realm is only effective on a fresh
# DB. sslRequired=none + demo redirect URIs are baked into clinic-realm.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: clinic
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: ghcr.io/steavy/cerios-clinic/keycloak:latest
          imagePullPolicy: Always
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin_secret
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/clinic_db
            - name: KC_DB_USERNAME
              value: clinic
            - name: KC_DB_PASSWORD
              value: clinic_secret
            - name: KC_DB_SCHEMA
              value: keycloak
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
          ports:
            - name: http
              containerPort: 8080
            - name: mgmt
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: mgmt
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
---
# Internal ClusterIP service used by the APIs and db-init (KEYCLOAK_URL).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: clinic
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# External NodePort service: demo-sparta.mooo.com:8180.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: clinic
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8180
      targetPort: 8080
      nodePort: 30009
